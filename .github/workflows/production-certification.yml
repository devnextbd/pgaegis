name: Production Certification Lab
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 0'
permissions: {contents: read}
jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: clippy}
      - run: bash tests/cert/rust-quality.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-quality-evidence
          path: tests/ha/lab/evidence/rust-quality.env
  debian13-package:
    runs-on: ubuntu-latest
    needs: rust-quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: bash tests/package/debian13-lifecycle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian13-package-evidence
          path: tests/ha/lab/evidence/debian13-package.env
  ha-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: PGAEGIS_DISPOSABLE_LAB=YES bash tests/ha/lab/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-certification-evidence
          path: tests/ha/lab/evidence/
  pitr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/cert/run-pitr-lab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitr-certification-evidence
          path: tests/cert/evidence/
  storage-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pgaegis-cert -f tests/cert/Dockerfile.cert tests/cert
      - run: mkdir -p tests/cert/evidence && docker run --rm --privileged -v "$PWD/tests/cert/evidence:/evidence" -e PGAEGIS_DISPOSABLE_VM=YES -e PGAEGIS_CERT_DIR=/evidence pgaegis-cert /usr/local/bin/storage-faults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-certification-evidence
          path: tests/cert/evidence/
  monitoring-faults:
    runs-on: ubuntu-latest
    needs: rust-quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: bash tests/cert/monitoring-faults.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-fault-evidence
          path: tests/cert/evidence/monitoring-faults.env
