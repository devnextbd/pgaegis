name: Release
on:
  push:
    tags: ['v*']
permissions: {contents: write}

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: clippy}
      - run: bash scripts/check-version.sh "${GITHUB_REF_NAME#v}"
      - run: bash tests/cert/rust-quality.sh

  debian13-package:
    runs-on: ubuntu-latest
    needs: rust-quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: bash tests/package/debian13-lifecycle.sh

  ha-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: rust-quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: PGAEGIS_DISPOSABLE_LAB=YES bash tests/ha/lab/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-release-evidence
          path: tests/ha/lab/evidence/

  pitr-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust-quality
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/cert/run-pitr-lab.sh

  storage-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rust-quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pgaegis-cert -f tests/cert/Dockerfile.cert tests/cert
      - run: mkdir -p tests/cert/evidence && docker run --rm --privileged -v "$PWD/tests/cert/evidence:/evidence" -e PGAEGIS_DISPOSABLE_VM=YES -e PGAEGIS_CERT_DIR=/evidence pgaegis-cert /usr/local/bin/storage-faults

  monitoring-qualification:
    runs-on: ubuntu-latest
    needs: rust-quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: bash tests/cert/monitoring-faults.sh

  build-release:
    runs-on: ubuntu-latest
    needs: [debian13-package, ha-qualification, pitr-qualification, storage-qualification, monitoring-qualification]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rpm zstd
          cargo install cross --locked
      - name: Build binaries
        run: |
          cargo build --release
          cargo build --release --target x86_64-unknown-linux-musl
          cross build --release --target aarch64-unknown-linux-musl
      - name: Build native and generic packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" ARCH=amd64 BIN="$PWD/target/x86_64-unknown-linux-musl/release/pgaegis" bash scripts/build-deb.sh
          VERSION="$VERSION" ARCH=arm64 BIN="$PWD/target/aarch64-unknown-linux-musl/release/pgaegis" bash scripts/build-deb.sh
          VERSION="$VERSION" ARCH=x86_64 BIN="$PWD/target/x86_64-unknown-linux-musl/release/pgaegis" bash scripts/build-rpm.sh
          VERSION="$VERSION" ARCH=aarch64 BIN="$PWD/target/aarch64-unknown-linux-musl/release/pgaegis" bash scripts/build-rpm.sh
          VERSION="$VERSION" ARCH=x86_64 BIN="$PWD/target/x86_64-unknown-linux-musl/release/pgaegis" bash scripts/build-arch.sh
          VERSION="$VERSION" ARCH=aarch64 BIN="$PWD/target/aarch64-unknown-linux-musl/release/pgaegis" bash scripts/build-arch.sh
          VERSION="$VERSION" ARCH=x86_64 BIN="$PWD/target/x86_64-unknown-linux-musl/release/pgaegis" bash scripts/build-generic.sh
          VERSION="$VERSION" ARCH=aarch64 BIN="$PWD/target/aarch64-unknown-linux-musl/release/pgaegis" bash scripts/build-generic.sh
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst *.tar.gz > SHA256SUMS
      - name: Native package smoke tests (x86_64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -lc "dnf install -y /dist/pgaegis-${VERSION}-1.x86_64.rpm && pgaegis version | grep -qx 'pgaegis ${VERSION}'"
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:latest bash -lc "pacman -Sy --noconfirm && pacman -U --noconfirm /dist/pgaegis-${VERSION}-1-x86_64.pkg.tar.zst && pgaegis version | grep -qx 'pgaegis ${VERSION}'"
          docker run --rm -v "$PWD/dist:/dist:ro" opensuse/leap:15.6 bash -lc "zypper --non-interactive install --allow-unsigned-rpm /dist/pgaegis-${VERSION}-1.x86_64.rpm && pgaegis version | grep -qx 'pgaegis ${VERSION}'"
          mkdir -p /tmp/pgaegis-generic && tar -xzf "dist/pgaegis_${VERSION}_linux_x86_64.tar.gz" -C /tmp/pgaegis-generic
          test -x "$(find /tmp/pgaegis-generic -path '*/bin/pgaegis' -type f | head -1)"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/SHA256SUMS
