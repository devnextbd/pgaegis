# Rendered by `pgaegis routing render` (server list and reader bind are filled in).
# The writer frontend only listens on loopback: its sole client is the local
# PgBouncer, so PostgreSQL's client-CIDR pg_hba rules cannot be bypassed via
# HAProxy from the network.
global
    log /dev/log local0
    maxconn 10000
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend pg_writer
    bind 127.0.0.1:5000
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
${SERVERS}

frontend pg_readers
    bind 127.0.0.1:5001
${READER_BIND}
    default_backend patroni_replicas

backend patroni_replicas
    balance leastconn
    option httpchk GET /replica
    http-check expect status 200
${SERVERS}
