global
    log /dev/log local0
    maxconn 10000
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend pg_writer
    bind *:5000
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
    server pg1 ${PG1_IP}:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/tls/patroni-ca.crt crt /etc/haproxy/tls/patroni-client.pem inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg2 ${PG2_IP}:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/tls/patroni-ca.crt crt /etc/haproxy/tls/patroni-client.pem inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg3 ${PG3_IP}:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/tls/patroni-ca.crt crt /etc/haproxy/tls/patroni-client.pem inter 2s fall 3 rise 2 on-marked-down shutdown-sessions

frontend pg_readers
    bind *:5001
    default_backend patroni_replicas

backend patroni_replicas
    balance leastconn
    option httpchk GET /replica
    http-check expect status 200
    server pg1 ${PG1_IP}:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/tls/patroni-ca.crt crt /etc/haproxy/tls/patroni-client.pem inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg2 ${PG2_IP}:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/tls/patroni-ca.crt crt /etc/haproxy/tls/patroni-client.pem inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg3 ${PG3_IP}:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/tls/patroni-ca.crt crt /etc/haproxy/tls/patroni-client.pem inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
