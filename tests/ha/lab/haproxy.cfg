global
    maxconn 5000

# Re-resolve container names through Docker's embedded DNS: a stopped/started
# member can come back with a different IP.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    mode tcp
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    # Kill sessions to a server as soon as its health check fails, so PgBouncer
    # does not keep reusing connections to a dead primary (no RST arrives from a
    # SIGKILLed container; without this each stale session hangs ~30s).
    default-server inter 1s fall 2 rise 1 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions

frontend writer
    bind *:5000
    default_backend primary

backend primary
    option httpchk GET /primary
    http-check expect status 200
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008
