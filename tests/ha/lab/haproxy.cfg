global
    maxconn 5000
defaults
    mode tcp
    timeout connect 3s
    timeout client 30s
    timeout server 30s
frontend writer
    bind *:5000
    default_backend primary
backend primary
    option httpchk GET /primary
    http-check expect status 200
    server pg1 pg1:5432 check port 8008 inter 1s fall 2 rise 1
    server pg2 pg2:5432 check port 8008 inter 1s fall 2 rise 1
    server pg3 pg3:5432 check port 8008 inter 1s fall 2 rise 1
