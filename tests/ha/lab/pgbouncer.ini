[databases]
postgres = host=127.0.0.1 port=5000 dbname=postgres
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
; Fast failover behaviour: retry server login after 1s (default 15s), give up
; on unreachable servers quickly, and verify idle server connections before
; reuse so connections to the old primary are discarded.
server_login_retry = 1
server_connect_timeout = 3
server_check_delay = 0
server_check_query = select 1
server_fast_close = 1
tcp_keepalive = 1
tcp_keepidle = 5
tcp_keepintvl = 2
tcp_keepcnt = 2
query_wait_timeout = 10
